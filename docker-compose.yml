services:
  db:
    image: postgres:16-alpine
    container_name: ejemplo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ejemplo_db}
      POSTGRES_USER: ${POSTGRES_USER:-ejemplo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ejemplo_pass_demo}
    volumes:
      # Subdirectorio vacío: Postgres no puede usar el mount point si contiene .gitkeep u otros archivos.
      - ./volume_bd/pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build: .
    container_name: ejemplo-app
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ejemplo_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ejemplo_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ejemplo_pass_demo}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: ejemplo-network
