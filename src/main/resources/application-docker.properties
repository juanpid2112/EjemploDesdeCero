# Perfil "docker": PostgreSQL en contenedor (Compose o variables de entorno).
# Activar con SPRING_PROFILES_ACTIVE=docker. Tests locales siguen usando perfil "test" + H2.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ejemplo_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ejemplo_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
