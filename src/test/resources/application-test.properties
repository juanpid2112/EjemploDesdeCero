# =============================================================================
# Perfil "test" (@ActiveProfiles("test")) — H2 en memoria para @DataJpaTest / E2E
# Duplicado intencional respecto a application.properties: aquí create-drop y BD
# distinta para no chocar con el nombre "testdb" del arranque local si aplica.
# =============================================================================
spring.datasource.url=jdbc:h2:mem:ejemplo_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Esquema limpio por ejecución de suite (recomendado en tests)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# La firma JWT sigue en JwtService (clave estática de desarrollo); en test no se
# replican secretos de producción — solo entorno aislado en memoria.
